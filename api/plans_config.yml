    active: true
    description: "Maximum power. Access to all PRO blocks and genetic search."
    features:
      - "Unlimited backtests"
      - "Access to PRO blocks (Tape, Book, OI)"
      - "Unlimited AI Assistant"
      - "Genetic strategy search"
      - "ML Model Laboratory"
      - "High task priority"
      - "30 live trading strategies"   
    permissions:
      - view_dashboard
      - run_backtest
      - run_portfolio_backtest
      - run_optimization
      - run_genetic_search
      - run_simulation
      - generate_dataset
      - train_model
      - save_strategy_config
      - view_strategies
      - allow_real_trading
      - use_ai_assistant
