# plans_config.yml
registration_trial:
  enabled: true
  plan: standard
  days: 0

# Legacy plan keys that are still stored on real rows (user accounts and the
# seeded strategy templates). Each one points at the canonical plan that carries
# the tier today. An alias is NOT a plan of its own: it is never sold, it never
# appears in the catalog, and the stored rows are never migrated.
plan_aliases:
  premium: managed

# Permissions a plan may HOLD but that no tier may ADVERTISE yet. The
# capability is an unfinished scaffold: the entitlement stays (and is still
# enforced), but the pricing copy must not promise it. Listing a permission
# here is the single switch that suppresses its label on EVERY tier -- it is
# neither advertised as included nor listed as "Not included".
deferred_permissions:
  - run_portfolio_backtest

block_restrictions:
  pro_only:
    - btc_state_filter
    - correlation
    - open_interest
    - tape_condition
    - order_book_zone_condition
    - l2_microstructure
    - conditional_exit
  kline_only:
    - senior_tf_confluence
    - tape_condition
    - tape_analysis
    - order_book_zone_condition
    - order_book_zone
    - l2_microstructure
    - l2_microstructure_check
    - trailing_stop
    - conditional_exit

billing:
  mode: monthly # monthly | lifetime
  lifetime:
    reservation_ttl_seconds: 900

plans:
  free:
    name: "Free"
    price_usd: 0
    active: true
    description: "Basic capabilities and standard strategy blocks."
    features:
      - "20 fast backtests per day"
      - "Standard blocks (Logic, Indicators, Proximity)"
      - "Limited history (90 days)"
      - "Limited trading pairs list"
      - "10 AI Assistant queries per day"
    permissions:
      - view_dashboard
      - run_backtest
      - view_strategies
      - use_ai_assistant
    allowed_symbols:
      - "0GUSDT"
      - "ADAUSDT"
      - "AIAUSDT"
      - "AVNTUSDT"
      - "BTCUSDT"
      - "COAIUSDT"
      - "DASHUSDT"
      - "DOGEUSDT"
      - "ETHUSDT"
      - "EVAAUSDT"
      - "FARTCOINUSDT"
      - "HIFIUSDT"
      - "HYPEUSDT"
      - "IPUSDT"
      - "JELLYJELLYUSDT"
      - "LINKUSDT"
      - "MYXUSDT"
      - "PUMPUSDT"
      - "SOLUSDT"
      - "SOONUSDT"
      - "TRUTHUSDT"
    quotas:
      run_vector_backtest_per_day: 20
      run_kline_backtest_per_day: 0
      use_ai_assistant_per_day: 10
      run_portfolio_backtest_per_day: 0
      run_optimization_per_month: 0
      run_genetic_search_per_month: 0
      generate_dataset_per_month: 0
      train_model_per_month: 0
    limits:
      allow_real_trading: false
      max_live_strategies: 0
      allow_intracandle_triggers: false
      max_backtest_duration_days: 90
      celery_task_priority: 9
      max_concurrent_tasks: 1
      allow_free_bybit_trading: true
      max_free_bybit_live_strategies: 5

  standard:
    name: "Standard"
    price_usd: 30
    billing:
      monthly:
        price_usd: 30
        period_days: 30
      lifetime:
        enabled: true
        price_usd: 99
        slot_limit: 75
    active: true
    description: "For active traders. Live trading and standard blocks."
    features:
      - "50 backtests per day"
      - "20 AI Assistant queries per day"
      - "Live trading enabled"
      - "Paper trading"
      - "Standard strategy blocks"
      - "Full history (1 year)"
      - "10 live trading strategies"
      - "TradingView webhooks"
    permissions:
      - view_dashboard
      - run_backtest
      - run_portfolio_backtest
      - save_strategy_config
      - view_strategies
      - allow_real_trading
      - use_ai_assistant
    quotas:
