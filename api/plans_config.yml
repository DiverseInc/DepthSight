      - "Managed strategy monitoring within your risk limits"
      - "Unlimited backtest history"
      - "Highest task priority and concurrency"
      - "Extended live strategy allowance"
    permissions:
      - view_dashboard
      - run_backtest
      - run_portfolio_backtest
      - run_optimization
      - run_genetic_search
      - run_simulation
      - generate_dataset
      - train_model
      - save_strategy_config
      - view_strategies
      - allow_real_trading
      - use_ai_assistant
    quotas:
      run_vector_backtest_per_day: -1
      run_kline_backtest_per_day: -1
      use_ai_assistant_per_day: -1
      run_portfolio_backtest_per_day: 0
      run_optimization_per_month: -1
      run_genetic_search_per_month: -1
      generate_dataset_per_month: -1
      train_model_per_month: -1
